version: '3.8'

services:
  backend-accessq:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-accessq
    ports:
      # Expose le port 5000 du conteneur vers le port 5000 de votre machine
      - "5000:5000"
    env_file:
      # Charge toutes vos variables d'environnement (y compris celles de Brevo et Prisma)
      - .env
    restart: unless-stopped
